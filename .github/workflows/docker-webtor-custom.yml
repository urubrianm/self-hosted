name: Build & Push Docker (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          no-cache: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:custom-ui-1.1.4
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            WEB_UI_REPO=https://github.com/urubrianm/web-ui.git
            WEB_UI_REF=custom-ui-1.1.4
